name: Mi10 SukiSU Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev python3 curl zip unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ccache
          ccache -M 5G

      - name: Clone kernel source
        run: |
          set -ex
          BRANCH="umi-q-oss"
          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "clone retry $i"
            sleep 5
          done
          test -d kernel
          # 打印可用 defconfig，确认真实文件名
          ls -l kernel/arch/arm64/configs/
          ls -l kernel/arch/arm64/configs/vendor/ || true

      - name: Add SukiSU builtin
        run: |
          set -ex
          cd kernel
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Patch defconfig
        run: |
          set -ex
          cd kernel
          # 先看上面 ls 出来的真实文件，必要时改这里
          DEFCONFIG="arch/arm64/configs/vendor/kona_defconfig"
          [ -f "$DEFCONFIG" ] || DEFCONFIG="arch/arm64/configs/umi_defconfig"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"

      - name: Build kernel
        run: |
          set -ex
          cd kernel
          # 同样以实际 defconfig 为准
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" kona_defconfig
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc)

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp kernel/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-umi-full.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Mi10
          path: ak3/SukiSU-umi-full.zip
