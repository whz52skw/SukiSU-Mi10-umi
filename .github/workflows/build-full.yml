name: Mi10 SukiSU Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev libc6-dev \
            python3 curl zip unzip ccache \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          ccache -M 5G

      - name: Clone kernel
        run: |
          set -ex
          BRANCH="umi-q-oss"
          rm -rf kernel
          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "retry $i"
            rm -rf kernel
            sleep 5
          done
          test -d kernel
          cd kernel
          echo "==== DEFCONFIGS ===="
          find arch/arm64 -type f -iname "*defconfig*" | sort

      - name: Add SukiSU builtin
        run: |
          set -ex
          cd kernel
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Fix gcc-wrapper
        run: |
          set -ex
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            cp scripts/gcc-wrapper.py scripts/gcc-wrapper.py.orig
            cat > scripts/gcc-wrapper.py <<'PY'
          #!/usr/bin/env python3
          import sys, subprocess
          sys.exit(subprocess.call(sys.argv[1:]))
          PY
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Prepare defconfig
        run: |
          set -ex
          cd kernel
          make mrproper || true

          ROOT="arch/arm64/configs"
          mkdir -p "$ROOT"

          # 优先固定小米 10 umi
          PICK="arch/arm64/configs/vendor/umi_user_defconfig"
          [ -f "$PICK" ] || \
            PICK="$(find arch/arm64 -type f -iname '*umi*defconfig' | head -n1)"
          [ -f "$PICK" ] || \
            PICK="$(find arch/arm64 -type f -iname '*kona*defconfig' | head -n1)"
          [ -f "$PICK" ] || \
            PICK="$(find arch/arm64 -type f -iname '*defconfig' | head -n1)"

          echo "PICKED: $PICK"
          test -f "$PICK"

          BASE="$(basename "$PICK")"
          # 已经是 xxx_defconfig，不要再重复拼接
          TARGET="$BASE"

          # vendor 子目录才复制；同目录不重复 cp
          if [ "$(dirname "$PICK")" != "$ROOT" ]; then
            cp -f "$PICK" "$ROOT/$BASE"
          fi

          CFG="$ROOT/$BASE"
          echo "CONFIG_KPROBES=y" >> "$CFG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$CFG"

          echo "DEFCONFIG_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "FINAL TARGET: $TARGET"

      - name: Build kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache aarch64-linux-gnu-gcc"
          export HOSTCC=gcc-9
          export HOSTCXX=g++-9
          export O="$PWD/out"

          make "$DEFCONFIG_TARGET"
          make olddefconfig
          make -j"$(nproc)" KCFLAGS="-Wno-error"

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd kernel

          IMAGE=""
          for f in \
            out/arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image; do
            [ -f "$f" ] && IMAGE="$f" && break
          done
          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-umi.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Mi10
          path: ak3/SukiSU-umi.zip
