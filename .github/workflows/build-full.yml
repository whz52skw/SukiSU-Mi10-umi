name: Mi10 SukiSU Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev python3 \
            curl zip unzip ccache \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          ccache -M 5G
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100 || true
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100 || true

      - name: Clone kernel source
        run: |
          set -ex
          BRANCH="umi-q-oss"
          for i in 1 2 3; do
            rm -rf kernel
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "clone retry $i"
            sleep 5
          done
          test -d kernel

          cd kernel
          echo "===== ALL DEFCONFIG FILES ====="
          find arch/arm64 -type f \( -iname "*defconfig*" \) | sort
          echo "================================"

      - name: Add SukiSU builtin
        run: |
          set -ex
          cd kernel
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Fix gcc-wrapper (Python3)
        run: |
          set -ex
          cd kernel

          if [ -f scripts/gcc-wrapper.py ]; then
            cp scripts/gcc-wrapper.py scripts/gcc-wrapper.py.orig
            cat > scripts/gcc-wrapper.py <<'PY'
          #!/usr/bin/env python3
          import sys, subprocess
          sys.exit(subprocess.call(sys.argv[1:]))
          PY
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Detect & prepare defconfig
        run: |
          set -ex
          cd kernel

          make mrproper || true

          CFG_DIR="arch/arm64/configs"
          mkdir -p "$CFG_DIR"

          # 全部候选
          mapfile -t FILES < <(find arch/arm64 -type f -iname "*defconfig*" | sort)
          printf "Candidates:\n"
          printf "%s\n" "${FILES[@]}"

          # 优先级：umi -> cmi -> kona -> qcom -> 其它
          PICK=""
          for kw in umi cmi kona qcom; do
            for f in "${FILES[@]}"; do
              if echo "$f" | grep -qi "$kw"; then
                PICK="$f"
                break
              fi
            done
            [ -n "$PICK" ] && break
          done

          # 兜底：取第一个
          if [ -z "$PICK" ] && [ ${#FILES[@]} -gt 0 ]; then
            PICK="${FILES[0]}"
          fi

          if [ -z "$PICK" ]; then
            echo "ERROR: no defconfig found"
            exit 1
          fi

          BASENAME="$(basename "$PICK")"

          # vendor / 子目录：复制到 configs 根，兼容老 Makefile
          if [ "$(dirname "$PICK")" != "$CFG_DIR" ]; then
            cp -f "$PICK" "$CFG_DIR/$BASENAME"
          fi

          # 去掉后缀，得到 make 目标
          TARGET="${BASENAME%.defconfig}_defconfig"
          if [ "$BASENAME" = "defconfig" ]; then
            TARGET="defconfig"
          fi

          echo "SELECTED FILE : $PICK"
          echo "MAKE TARGET   : $TARGET"
          echo "DEFCONFIG_TARGET=$TARGET" >> "$GITHUB_ENV"

          # 追加常用项（重复也无妨，后面 olddefconfig 收敛）
          MAIN_CFG="$CFG_DIR/$BASENAME"
          echo "CONFIG_KPM=y" >> "$MAIN_CFG"
          echo "CONFIG_KALLSYMS=y" >> "$MAIN_CFG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$MAIN_CFG"

      - name: Build kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache aarch64-linux-gnu-gcc"
          export HOSTCC=gcc-9
          export HOSTCXX=g++-9

          echo "Building with: $DEFCONFIG_TARGET"
          make "$DEFCONFIG_TARGET"
          make olddefconfig
          make -j"$(nproc)"

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

          cd kernel
          IMAGE=""
          for f in \
            arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image; do
            if [ -f "$f" ]; then
              IMAGE="$f"
              break
            fi
          done
          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-umi-full.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Mi10
          path: ak3/SukiSU-umi-full.zip
