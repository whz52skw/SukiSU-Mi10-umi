name: Mi10 UMI SukiSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev \
            linux-libc-dev libc6-dev \
            python3 curl wget zip unzip \
            ccache make \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          ccache -M 8G
          ccache -z

      - name: Setup Toolchain
        id: toolchain
        run: |
          set +e
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          CLANG_DIR="$HOME/toolchains/proton-clang"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            wget -q --tries=3 --timeout=120 -O proton.tar.gz \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"
            if [ -s proton.tar.gz ]; then
              mkdir -p "$CLANG_DIR"
              tar -xzf proton.tar.gz -C "$CLANG_DIR" --strip-components=1
            fi
          fi

          if [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
            echo "USE_CLANG=1" >> "$GITHUB_ENV"
          else
            echo "USE_CLANG=0" >> "$GITHUB_ENV"
          fi

      - name: Clone Kernel (UMI)
        run: |
          set -ex
          BRANCH="umi-q-oss"
          rm -rf kernel

          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "Clone retry $i"
            rm -rf kernel
            sleep 8
          done

          test -d kernel
          cd kernel
          find arch/arm64/configs -type f | sort

      - name: Apply SukiSU Ultra
        run: |
          set -ex
          cd kernel
          curl -LSs --retry 3 \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Prepare Defconfig
        id: defcfg
        run: |
          set -ex
          cd kernel
          make mrproper || true

          CFG_ROOT="arch/arm64/configs"
          PICK=""

          for KEY in umi kona cmi; do
            PICK="$(find "$CFG_ROOT" -type f -iname "*${KEY}*defconfig*" | head -n1)"
            [ -n "$PICK" ] && break
          done

          if [ -z "$PICK" ]; then
            PICK="$(find "$CFG_ROOT" -type f -iname "*defconfig*" | head -n1)"
          fi

          test -n "$PICK"

          REAL_SRC="$(readlink -f "$PICK")"
          BASE="$(basename "$PICK")"
          DST="$CFG_ROOT/$BASE"
          REAL_DST="$(readlink -f "$DST" 2>/dev/null || true)"

          if [ "$REAL_SRC" != "$REAL_DST" ]; then
            cp -f "$PICK" "$DST"
            MAKE_TARGET="$BASE"
          else
            MAKE_TARGET="$(realpath --relative-to="$CFG_ROOT" "$PICK")"
          fi

          echo "PICKED: $PICK"
          echo "MAKE_TARGET: $MAKE_TARGET"
          echo "MAKE_TARGET=$MAKE_TARGET" >> "$GITHUB_ENV"

      - name: Build Kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export O="$PWD/out"
          mkdir -p "$O"

          if [ "$USE_CLANG" = "1" ]; then
            export PATH="$CLANG_DIR/bin:$PATH"
            export CC=clang
            export HOSTCC=clang
            export HOSTCXX=clang++
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          else
            export CC="ccache aarch64-linux-gnu-gcc-9"
            export HOSTCC=gcc-9
            export HOSTCXX=g++-9
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          fi

          make "$MAKE_TARGET"

          if [ -x scripts/config ]; then
            scripts/config \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable KALLSYMS \
              --enable KALLSYMS_ALL \
              --enable FUNCTION_TRACER \
              --enable DYNAMIC_FTRACE
          fi

          make olddefconfig
          make -j"$(nproc)" KCFLAGS="-Wno-error"

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd kernel

          IMAGE=""
          for f in \
            out/arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            arch/arm64/boot/Image; do
            [ -f "$f" ] && IMAGE="$f" && break
          done

          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-UMI.zip . -x ".git/*" "README.md"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-UMI
          path: ak3/SukiSU-UMI.zip
          retention-days: 7
