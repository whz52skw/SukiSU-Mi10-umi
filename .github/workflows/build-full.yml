name: Mi10 UMI SukiSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev \
            linux-libc-dev libc6-dev \
            python3 python3-pip curl wget zip unzip \
            ccache make \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

          # 修复 KernelSU ./usr/include not found
          sudo mkdir -p /usr/include
          sudo ln -sf /usr/include/x86_64-linux-gnu/* /usr/include/ || true

          ccache -M 8G
          ccache -z

      - name: Setup Fixed Clang
        id: clang
        run: |
          set +e
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"

          # 固定稳定版，不用 master（master 经常变动/下载失败）
          CLANG_VER="clang-r487747c"
          CLANG_DIR="$HOME/toolchains/$CLANG_VER"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            for URL in \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/$CLANG_VER.tar.gz" \
              "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz"; do
              echo "Try: $URL"
              if wget -q --tries=3 --timeout=60 -O tool.tar.gz "$URL"; then
                tar -xzf tool.tar.gz -C "$CLANG_DIR" --strip-components=1
                break
              fi
              rm -f tool.tar.gz
            done
          fi

          if [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
            echo "USE_CLANG=1" >> "$GITHUB_ENV"
          else
            echo "USE_CLANG=0" >> "$GITHUB_ENV"
          fi

      - name: Clone Kernel (UMI)
        run: |
          set -ex
          BRANCH="umi-q-oss"
          rm -rf kernel

          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "Clone retry $i"
            rm -rf kernel
            sleep 8
          done

          test -d kernel
          cd kernel
          echo "==== ALL DEFCONFIGS ===="
          find arch/arm64/configs -type f \( -iname "*umi*defconfig*" -o -iname "*kona*defconfig*" -o -iname "*cmi*defconfig*" \) | sort

      - name: Apply SukiSU Ultra
        run: |
          set +e
          cd kernel

          for i in 1 2 3; do
            curl -LSs --retry 3 \
              "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
              | bash -s builtin \
              && break
            echo "SukiSU retry $i"
            sleep 5
          done

          # 兼容不同版本参数；失败不直接中断，后面编译会暴露真实问题
          bash kernel/setup.sh builtin || true

      - name: Fix gcc-wrapper
        run: |
          set -ex
          cd kernel
          if [ -f scripts/gcc-wrapper.py ]; then
            cat > scripts/gcc-wrapper.py <<'PY'
#!/usr/bin/env python3
import sys, subprocess
sys.exit(subprocess.call(sys.argv[1:]))
PY
            chmod +x scripts/gcc-wrapper.py
          fi

      - name: Prepare Defconfig
        id: defcfg
        run: |
          set -ex
          cd kernel
          make mrproper || true

          CFG_ROOT="arch/arm64/configs"

          # 自动找：umi -> kona -> cmi -> 任意 defconfig
          PICK=""
          for KEY in umi kona cmi; do
            PICK="$(find "$CFG_ROOT" -type f -iname "*${KEY}*defconfig*" | head -n1)"
            [ -n "$PICK" ] && break
          done
          [ -z "$PICK" ] && PICK="$(find "$CFG_ROOT" -type f -iname "*defconfig*" | head -n1)"
          test -n "$PICK"

          REAL_SRC="$(readlink -f "$PICK")"
          BASE="$(basename "$PICK")"
          DST="$CFG_ROOT/$BASE"
          REAL_DST="$(readlink -f "$DST" 2>/dev/null || true)"

          # 彻底避免 same file / cp 报错
          if [ "$REAL_SRC" != "$REAL_DST" ]; then
            mkdir -p "$CFG_ROOT"
            cp -f "$PICK" "$DST"
            MAKE_TARGET="$BASE"
          else
            # vendor 子目录：保留相对路径，交给 Kbuild
            MAKE_TARGET="$(realpath --relative-to="$CFG_ROOT" "$PICK")"
          fi

          echo "PICKED: $PICK"
          echo "MAKE_TARGET: $MAKE_TARGET"
          echo "MAKE_TARGET=$MAKE_TARGET" >> "$GITHUB_ENV"

      - name: Build Kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export O="$PWD/out"
          mkdir -p "$O"

          if [ "$USE_CLANG" = "1" ]; then
            export PATH="$CLANG_DIR/bin:$PATH"
            export CC=clang
            export HOSTCC=clang
            export HOSTCXX=clang++
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          else
            export CC="ccache aarch64-linux-gnu-gcc-9"
            export HOSTCC=gcc-9
            export HOSTCXX=g++-9
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          fi

          # 生成基础配置
          make "$MAKE_TARGET"

          # 用 scripts/config 开启，避免 echo 重复项
          if [ -x scripts/config ]; then
            scripts/config \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable FUNCTION_TRACER \
              --enable DYNAMIC_FTRACE
          fi

          make olddefconfig

          # 老内核兼容，防止警告变错误
          make -j"$(nproc)" \
            KCFLAGS="-Wno-error -fno-stack-protector" \
            CFLAGS_MODULE="-Wno-error"

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd kernel

          IMAGE=""
          for f in \
            out/arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            arch/arm64/boot/Image; do
            [ -f "$f" ] && IMAGE="$f" && break
          done
          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          sed -i "s/^# slotselect.*/slotselect all/" anykernel.sh

          zip -r9 SukiSU-UMI.zip . \
            -x ".git/*" "README.md"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-UMI
          path: ak3/SukiSU-UMI.zip
          retention-days: 7
