name: Mi10 UMI SukiSU Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev \
            linux-libc-dev libc6-dev \
            python3 python3-pip curl wget zip unzip \
            ccache make \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          ccache -M 8G
          ccache -z

      - name: Setup Toolchain
        id: toolchain
        run: |
          set +e
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          CLANG_DIR="$HOME/toolchains/proton-clang"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR"
            git clone --depth=1 \
              https://github.com/kdrag0n/proton-clang.git "$CLANG_DIR"
          fi
          if [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
            echo "USE_CLANG=1" >> "$GITHUB_ENV"
          else
            echo "USE_CLANG=0" >> "$GITHUB_ENV"
          fi

      - name: Clone Kernel (UMI)
        run: |
          set -ex
          BRANCH="umi-q-oss"
          rm -rf kernel
          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "Clone retry $i"
            rm -rf kernel
            sleep 8
          done
          test -d kernel
          cd kernel
          find . -type f \
            \( -iname "*umi*defconfig*" -o -iname "*kona*defconfig*" \) | sort

      - name: Apply SukiSU Ultra
        run: |
          set -ex
          cd kernel
          curl -LSs --retry 3 \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Fix gcc-wrapper after SukiSU
        run: |
          set -ex
          cd kernel

          # Disable wrapper references; allow leading spaces
          find . -type f \
            \( -name "Makefile" -o -name "*.mk" \) -print0 \
            | while IFS= read -r -d '' f; do
                sed -i \
                  -e 's/\(GCC_WRAPPER[[:space:]]*:=[[:space:]]*\).*/\1/' \
                  -e 's/\(GCC_WRAPPER[[:space:]]*=[[:space:]]*\).*/\1/' \
                  "$f" || true
              done

          # Python3 compatible passthrough
          mkdir -p scripts
          echo "IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwppbXBvcnQgc3lzCmltcG9ydCBzdWJwcm9jZXNzCgpkZWYgbWFpbigpOgogICAgaWYgbGVuKHN5cy5hcmd2KSA8IDI6CiAgICAgICAgcmV0dXJuIDAKICAgIHJldHVybiBzdWJwcm9jZXNzLmNhbGwoc3lzLmFyZ3ZbMTpdKQoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIHN5cy5leGl0KG1haW4oKSkK" \
            | base64 -d > scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py
          python3 -m py_compile scripts/gcc-wrapper.py

      - name: Prepare Defconfig
        id: defcfg
        run: |
          set -ex
          cd kernel
          make mrproper || true

          PICK=""
          for KEY in umi_user umi kona cmi; do
            PICK="$(find . -type f -iname "*${KEY}*defconfig*" | head -n1)"
            [ -n "$PICK" ] && break
          done
          [ -z "$PICK" ] && PICK="$(find . -type f -iname "*defconfig*" | head -n1)"
          test -n "$PICK"

          MAKE_TARGET="$PICK"
          if echo "$PICK" | grep -q "arch/arm64/configs/"; then
            BASE="$(basename "$PICK")"
            DST="arch/arm64/configs/$BASE"
            REAL_SRC="$(readlink -f "$PICK")"
            REAL_DST="$(readlink -f "$DST" 2>/dev/null || true)"
            if [ "$REAL_SRC" != "$REAL_DST" ]; then
              cp -f "$PICK" "$DST"
              MAKE_TARGET="$BASE"
            fi
          fi

          echo "PICKED: $PICK"
          echo "MAKE_TARGET: $MAKE_TARGET"
          echo "MAKE_TARGET=$MAKE_TARGET" >> "$GITHUB_ENV"

      - name: Build Kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export O="$PWD/out"
          mkdir -p "$O"

          if [ "$USE_CLANG" = "1" ]; then
            export PATH="$CLANG_DIR/bin:$PATH"
            export CC=clang
            export HOSTCC=clang
            export HOSTCXX=clang++
            export CLANG_TRIPLE=aarch64-linux-gnu-
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          else
            export CC="ccache aarch64-linux-gnu-gcc-9"
            export HOSTCC=gcc-9
            export HOSTCXX=g++-9
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          fi

          make "$MAKE_TARGET"

          if [ -x scripts/config ]; then
            scripts/config \
              --enable KPROBES \
              --enable KPROBE_EVENTS \
              --enable KALLSYMS \
              --enable KALLSYMS_ALL \
              --enable EXT4_FS \
              --enable FUNCTION_TRACER \
              --enable DYNAMIC_FTRACE
          fi

          make olddefconfig
          make -j"$(nproc)"

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd kernel

          IMAGE=""
          for f in \
            out/arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image \
            arch/arm64/boot/Image; do
            [ -f "$f" ] && IMAGE="$f" && break
          done
          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-UMI.zip . -x ".git/*" "README.md"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-UMI
          path: ak3/SukiSU-UMI.zip
          retention-days: 7
