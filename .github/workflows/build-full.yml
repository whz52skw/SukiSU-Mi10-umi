name: Mi10 SukiSU Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -ex
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev python3 \
            curl zip unzip ccache \
            gcc-9 g++-9 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          ccache -M 5G
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100 || true
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100 || true

      - name: Clone kernel source
        run: |
          set -ex
          BRANCH="umi-q-oss"
          for i in 1 2 3; do
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel \
              && break
            echo "clone retry $i"
            sleep 5
          done
          test -d kernel
          find kernel/arch/arm64/configs -maxdepth 2 -type f | sort

      - name: Add SukiSU builtin
        run: |
          set -ex
          cd kernel
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

      - name: Fix gcc-wrapper and Makefile
        run: |
          set -ex
          cd kernel

          # 1) 备份后重写为直通转发，避免 py2 print；同时保留原文件
          if [ -f scripts/gcc-wrapper.py ]; then
            cp scripts/gcc-wrapper.py scripts/gcc-wrapper.py.orig
            cat > scripts/gcc-wrapper.py <<'PY'
          #!/usr/bin/env python3
          import sys, subprocess
          args = sys.argv[1:]
          sys.exit(subprocess.call(args))
          PY
            chmod +x scripts/gcc-wrapper.py
          fi

          # 2) 扫描并注释掉强制把 CC 指向 wrapper 的地方
          grep -RIn "gcc-wrapper.py" Makefile scripts 2>/dev/null || true
          sed -i \
            -e 's|^\(.*gcc-wrapper\.py.*\)|# \1|' \
            Makefile 2>/dev/null || true
          find scripts -maxdepth 3 -name "Makefile*" -print0 \
            | while IFS= read -r -d '' f; do
                sed -i \
                  -e 's|^\(.*gcc-wrapper\.py.*\)|# \1|' \
                  "$f"
              done

      - name: Patch defconfig
        run: |
          set -ex
          cd kernel

          if [ -f arch/arm64/configs/vendor/kona_defconfig ]; then
            DEFCONFIG="arch/arm64/configs/vendor/kona_defconfig"
          elif [ -f arch/arm64/configs/kona_defconfig ]; then
            DEFCONFIG="arch/arm64/configs/kona_defconfig"
          else
            DEFCONFIG="arch/arm64/configs/umi_defconfig"
          fi

          echo "USE DEFCONFIG: $DEFCONFIG"
          test -f "$DEFCONFIG"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"

      - name: Build kernel
        run: |
          set -ex
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 目标编译器：ccache + 交叉 gcc；主机编译器单独给 HOSTCC
          export CC="ccache aarch64-linux-gnu-gcc"
          export HOSTCC=gcc-9
          export HOSTCXX=g++-9

          if [ -f arch/arm64/configs/vendor/kona_defconfig ]; then
            make kona_defconfig
          elif [ -f arch/arm64/configs/kona_defconfig ]; then
            make kona_defconfig
          else
            make umi_defconfig
          fi

          make -j$(nproc)

      - name: Pack AnyKernel3
        run: |
          set -ex
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

          cd kernel
          IMAGE=""
          for f in \
            arch/arm64/boot/Image.gz-dtb \
            arch/arm64/boot/Image.gz \
            arch/arm64/boot/Image; do
            if [ -f "$f" ]; then
              IMAGE="$f"
              break
            fi
          done
          test -n "$IMAGE"
          cp "$IMAGE" ../ak3/

          cd ../ak3
          sed -i "s/device.name1=.*/device.name1=umi/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=Mi 10/" anykernel.sh
          sed -i "s/is_slot_device=.*/is_slot_device=1/" anykernel.sh
          zip -r9 SukiSU-umi-full.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Mi10
          path: ak3/SukiSU-umi-full.zip
